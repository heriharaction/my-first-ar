<!DOCTYPE html>
<html lang="ja">
  <head>
    <script>
  // 画面が自動で暗く（スリープ）なるのを防ぐプログラム
  let wakeLock = null;

  async function requestWakeLock() {
    try {
      // ブラウザがスリープ防止機能に対応しているか確認
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('画面スリープ防止が有効になりました');
      }
    } catch (err) {
      console.log(`スリープ防止機能のエラー: ${err.name}, ${err.message}`);
    }
  }

  // ページを読み込んだタイミングでスリープ防止をONにする
  window.addEventListener('load', () => {
    requestWakeLock();
  });

  // 一度ほかのアプリに切り替えてから、もう一度AR画面に戻ってきたときにも自動で再ONにする
  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });
</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>複数のマーカーを使うWebAR</title>

    <!-- 頭脳の読み込み -->
    <script src="./js/aframe.min.js"></script>
    <script src="./js/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- ARの舞台をセット -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- ☀️ 【追加】全体を明るくするライト（光の色と強さを指定） -->
  <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>

      <!-- 🟢 【1つ目のマーカー】定番のHIROマーカー -->
      <a-marker preset="hiro">
        <a-entity
          gltf-model="./assets/model1.glb"
          position="0 0.1 0"
          scale="0.1 0.1 0.1">
        </a-entity>
      </a-marker>

      <!-- 🔵 【2つ目のマーカー】自分で作ったオリジナルのマーク -->
      <a-marker type="pattern" url="./assets/marker2.patt">
        <a-entity
          gltf-model="./assets/model2.glb"
          position="0 0.1 0"
          scale="0.1 0.1 0.1">
        </a-entity>
      </a-marker>

      <!-- カメラの設定 -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
